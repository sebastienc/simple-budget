<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The app-icon mark (build/icon.svg) optimised for 16px: same proportions and
    palette, but the dashed zero line is dropped and the stroke is thickened —
    at favicon size the line reads as noise and a proportional stroke reads as
    a hairline. The colour change alone still carries "this is where it goes
    under".
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17A0AC" />
      <stop offset="1" stop-color="#0A5F68" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#ground)" />

  <path d="M3.2 9.6 H9.8 V13.5 H16.4 V17 H23 V18.9" fill="none" stroke="#FCFCFD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M23 18.9 V22.4 H28.8" fill="none" stroke="#F5915A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
