name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs electron-builder install-app-deps, which downloads
      # Electron to rebuild better-sqlite3 against it. Caching that keeps a
      # ~100 MB download off every run.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # `npm run build` is `tsc -b && electron-vite build`, so this typechecks
      # the renderer and main process as well as bundling them.
      - run: npm run build
