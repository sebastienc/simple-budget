name: CI

# Pull requests only. Anything reaching main has already been checked on the
# PR that carried it, and main's own workflow is Release. The trade is that a
# commit pushed straight to main is never checked — so don't.
on:
  pull_request:

# A new push to the same PR makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs electron-builder install-app-deps, which downloads
      # Electron to rebuild better-sqlite3 against it. Caching that keeps a
      # ~100 MB download off every run.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # `npm run build` is `tsc -b && electron-vite build`, so this typechecks
      # the renderer and main process as well as bundling them.
      - run: npm run build
