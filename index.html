<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Budget</title>
    <script>
      // Applies the stored (or OS) theme before first paint. Without this the
      // app renders light for a frame and flashes on launch for dark users.
      // Mirrors resolveInitialTheme() in src/theme/useTheme.tsx.
      (function () {
        try {
          var stored = window.localStorage.getItem('selectedTheme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* private mode or storage disabled — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
